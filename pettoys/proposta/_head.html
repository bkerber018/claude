<title>Proposta StillPet Amazon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62.5..125,400..800&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
:root{
  color-scheme: dark;
  --ink:#080D18; --ink2:#111A2C; --ink3:#182440; --rule:#24314F;
  --hot:#FF4A1C; --hot-d:#C22F08;
  --seal:#3B82F6; --seal-l:#7FA8F0;
  --paper:#F7F4F0; --text:#C6D1E4; --mute:#78839A; --faint:#4C5670;
  --amber:#F5A524; --green:#35B37E;
  --fd:"Archivo",system-ui,sans-serif;
  --fm:"JetBrains Mono",ui-monospace,monospace;
  --exp:'wdth' 122; --cond:'wdth' 88;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--fd);
  -webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;font-family:var(--fd)}

.deck{position:fixed;inset:0}
.slide{position:absolute;inset:0;display:none;flex-direction:column;
  padding:clamp(28px,4.4vh,64px) clamp(24px,4.2vw,92px) clamp(54px,7vh,88px);overflow:hidden}
.slide.on{display:flex}
.slide.on > *{animation:rise .5s cubic-bezier(.16,1,.3,1) both}
.slide.on > *:nth-child(1){animation-delay:.02s}
.slide.on > *:nth-child(2){animation-delay:.07s}
.slide.on > *:nth-child(3){animation-delay:.12s}
.slide.on > *:nth-child(4){animation-delay:.17s}
.slide.on > *:nth-child(5){animation-delay:.22s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.slide.on > *{animation:none}}

.eyebrow{font-family:var(--fm);font-size:clamp(10px,.86vw,15px);font-weight:700;
  letter-spacing:.22em;text-transform:uppercase;color:var(--hot);
  display:flex;gap:12px;align-items:center;margin-bottom:clamp(12px,2.2vh,26px);flex:0 0 auto}
.eyebrow b{color:var(--faint);font-weight:400;letter-spacing:.16em}
h1{font-family:var(--fd);font-variation-settings:var(--exp);font-weight:800;
  font-size:clamp(28px,4.3vw,80px);line-height:.95;letter-spacing:-.025em;
  color:var(--paper);margin:0 0 clamp(12px,2vh,22px);text-wrap:balance;flex:0 0 auto}
h1 em{font-style:normal;color:var(--hot)}
h2{font-family:var(--fd);font-variation-settings:var(--exp);font-weight:700;
  font-size:clamp(17px,1.72vw,32px);line-height:1.05;color:var(--paper);margin:0 0 14px}
.sub{font-size:clamp(15px,1.36vw,28px);line-height:1.38;color:var(--text);
  max-width:56ch;margin:0 0 clamp(10px,1.6vh,18px)}
.sub strong{color:var(--paper);font-weight:700}
.small{font-size:clamp(13px,1.02vw,21px);line-height:1.46;color:var(--mute);max-width:58ch}
.kick{margin-top:auto;padding-top:clamp(12px,2vh,22px);border-top:1px solid var(--rule);
  font-family:var(--fd);font-variation-settings:var(--cond);
  font-size:clamp(14px,1.42vw,30px);line-height:1.16;color:var(--paper);
  font-weight:700;text-wrap:balance;flex:0 0 auto}
.kick .small{color:var(--mute);font-variation-settings:normal;font-weight:400;margin-top:8px}

.ev{flex:1;min-height:0;display:grid;gap:clamp(18px,2.4vw,44px);
  grid-template-columns:1fr 1fr;align-items:start}
.ev.wide{grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr)}
.col{min-height:0;display:flex;flex-direction:column;overflow-y:auto;
  scrollbar-width:thin;scrollbar-color:var(--rule) transparent}
.col::-webkit-scrollbar{width:6px}
.col::-webkit-scrollbar-thumb{background:var(--rule)}

.rows{display:flex;flex-direction:column;font-size:clamp(13px,1.14vw,23px)}
.row{display:flex;justify-content:space-between;gap:18px;
  padding:clamp(7px,1.05vh,15px) 0;border-bottom:1px solid var(--rule)}
.row:last-child{border-bottom:0}
.row>span:first-child{color:var(--text)}
.row>span:last-child{color:var(--paper);font-family:var(--fm);
  font-size:clamp(12px,.98vw,20px);text-align:right;font-variant-numeric:tabular-nums}
.row .hot{color:var(--hot)!important} .row .grn{color:var(--green)!important}
.row .amb{color:var(--amber)!important} .row .mut{color:var(--mute)!important}

.figs{display:flex;flex-wrap:wrap;gap:clamp(18px,3vw,60px);align-items:flex-end}
.fig{display:flex;flex-direction:column}
.fig .n{font-family:var(--fd);font-variation-settings:var(--exp);font-weight:800;
  font-size:clamp(40px,7vw,138px);line-height:.82;color:var(--paper);
  letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.fig .n.hot{color:var(--hot)} .fig .n small{font-size:.42em;letter-spacing:-.02em}
.fig .l{font-family:var(--fm);font-size:clamp(11px,.84vw,16px);letter-spacing:.14em;
  text-transform:uppercase;color:var(--mute);margin-top:14px;max-width:22ch;line-height:1.5}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(clamp(150px,16vw,240px),1fr));
  gap:1px;background:var(--rule);border:1px solid var(--rule)}
.tile{background:var(--ink2);padding:clamp(13px,2vh,26px) clamp(14px,1.4vw,26px)}
.tile .k{font-family:var(--fm);font-size:clamp(10px,.76vw,14px);letter-spacing:.16em;
  text-transform:uppercase;color:var(--hot);margin-bottom:10px}
.tile .t{font-family:var(--fd);font-variation-settings:var(--exp);font-weight:700;
  font-size:clamp(16px,1.5vw,26px);color:var(--paper);line-height:1.08;margin-bottom:9px}
.tile .l{font-size:clamp(12px,.96vw,19px);line-height:1.4;color:var(--mute)}

.no{display:grid;grid-template-columns:repeat(auto-fit,minmax(clamp(160px,17vw,250px),1fr));gap:1px;
  background:var(--rule);border:1px solid var(--rule)}
.no div{background:var(--ink2);padding:clamp(12px,1.8vh,22px) clamp(13px,1.3vw,24px);
  font-size:clamp(13px,1.02vw,21px);line-height:1.38;color:var(--text)}
.no div b{display:block;font-family:var(--fm);font-size:clamp(10px,.72vw,13px);
  letter-spacing:.14em;text-transform:uppercase;color:var(--hot);margin-bottom:8px;font-weight:700}

.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--rule);
  border:1px solid var(--rule);flex:0 0 auto}
.tl{background:var(--ink2);padding:clamp(13px,2vh,24px) clamp(12px,1.2vw,22px)}
.tl .m{font-family:var(--fm);font-size:clamp(10px,.76vw,14px);letter-spacing:.14em;
  color:var(--hot);text-transform:uppercase;margin-bottom:10px}
.tl .t{font-family:var(--fd);font-variation-settings:var(--exp);font-weight:700;
  font-size:clamp(15px,1.4vw,25px);color:var(--paper);line-height:1.08;margin-bottom:10px}
.tl ul{margin:0;padding-left:16px;font-size:clamp(12px,.94vw,18px);line-height:1.42;color:var(--mute)}
.tl li{margin-bottom:5px}
.tl li::marker{color:var(--faint)}

.price{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--rule);
  border:1px solid var(--rule);flex:0 0 auto}
.pc{background:var(--ink2);padding:clamp(18px,2.8vh,36px) clamp(18px,1.9vw,36px)}
.pc .k{font-family:var(--fm);font-size:clamp(10px,.78vw,14px);letter-spacing:.16em;
  text-transform:uppercase;color:var(--hot);margin-bottom:14px}
.pc .v{font-family:var(--fd);font-variation-settings:var(--exp);font-weight:800;
  font-size:clamp(34px,4.4vw,80px);line-height:.9;color:var(--paper);
  letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.pc .v small{font-size:.32em;color:var(--mute);letter-spacing:0;font-weight:500}
.pc .d{font-size:clamp(12px,.96vw,19px);line-height:1.42;color:var(--mute);margin-top:14px}

.pill{display:inline-flex;align-items:center;gap:7px;font-family:var(--fm);
  font-size:clamp(10px,.74vw,14px);letter-spacing:.12em;text-transform:uppercase;
  padding:6px 12px;border:1px solid var(--rule);color:var(--mute)}
.pill.grn{color:var(--green);border-color:#1F4A38}
.pill.hot{color:var(--hot);border-color:#5B2412}

.rail{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;align-items:center;
  gap:clamp(10px,1.4vw,20px);padding:clamp(9px,1.3vh,15px) clamp(24px,4.2vw,92px);
  padding-bottom:calc(clamp(9px,1.3vh,15px) + env(safe-area-inset-bottom,0px));
  font-family:var(--fm);font-size:clamp(10px,.78vw,14px);color:var(--mute);
  letter-spacing:.14em;text-transform:uppercase;
  background:linear-gradient(to top,var(--ink) 55%,transparent)}
#pos em{font-style:normal;color:var(--hot)}
.topbar{position:fixed;left:0;right:0;top:0;height:2px;background:var(--rule);z-index:5}
.topbar i{display:block;height:100%;background:var(--hot);width:0;transition:width .45s cubic-bezier(.16,1,.3,1)}
.hint{margin-left:auto;color:var(--faint)}
.nav{display:flex;gap:5px}
.nav button,.fsbtn{background:transparent;border:1px solid var(--rule);width:32px;height:28px;
  cursor:pointer;color:var(--mute);display:grid;place-items:center;font-size:12px;
  transition:border-color .18s,color .18s}
.nav button:hover:not(:disabled),.fsbtn:hover{border-color:var(--hot);color:var(--hot)}
.nav button:disabled{opacity:.28;cursor:default}
.fsbtn{width:auto;padding:0 11px;font-family:var(--fm);font-size:9px;letter-spacing:.14em}

@media(max-width:860px){
  body{overflow:auto} .deck{position:static}
  .slide{position:static;min-height:calc(100vh - 44px);padding:24px 18px 60px}
  .ev,.ev.wide,.price{grid-template-columns:1fr}
  .timeline{grid-template-columns:1fr 1fr}
  .hint{display:none}
}
</style>
